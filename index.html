<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lostinframess</title>
  
  <!-- Google Fonts: Inter & Playfair Display for premium look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
        :root {
      /* Beige & Black Theme Color Palette */
      --cream-bg: #F4EEDD;          /* Premium Warm Beige Background */
      --sage-green: #111111;        /* Black for buttons */
      --sage-dark: #333333;         /* Dark Gray for hover */
      --dusty-rose: #111111;       /* Accent Black */
      --rose-light: #EAE3D2;       /* Light Beige Tint */
      --card-bg: #FFFDF9;          /* Soft Card Background */
      --text-main: #1A1A1A;        /* Dark Main Text */
      --text-muted: #666666;       /* Muted Text */
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.1);
    }


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--cream-bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 30px 15px 50px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tagline at the very top */
    .top-tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--sage-dark);
      margin-bottom: 24px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Header Profile Section */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      width: 100%;
    }

    .profile-ring {
      position: relative;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--dusty-rose), var(--sage-green));
      margin-bottom: 14px;
      box-shadow: var(--shadow-md);
    }

    .profile-img {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background-color: #000;
      overflow: hidden;
      border: 3px solid var(--cream-bg);
    }

    .profile-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .verified-icon {
      color: var(--sage-green);
      font-size: 17px;
    }

    /* Telegram Quick Access Button under profile */
    .telegram-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background-color: #0088cc;
      color: #FFFFFF;
      padding: 10px 22px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 14px rgba(0, 136, 204, 0.25);
      transition: all 0.3s ease;
    }

    .telegram-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 136, 204, 0.35);
    }

    /* Banner Button (Movies Link) */
    .banner-btn {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(216, 167, 177, 0.3);
      padding: 16px 22px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 35px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .banner-btn:hover {
      transform: translateY(-2px);
      border-color: var(--dusty-rose);
      box-shadow: var(--shadow-md);
    }

    .banner-btn .icon-box {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--rose-light);
      color: var(--dusty-rose);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* Section Styling */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      color: var(--sage-dark);
      text-transform: uppercase;
      width: 100%;
      text-align: left;
      padding-left: 5px;
    }

    /* Product Grid Layout */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      margin-bottom: 35px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(138, 154, 134, 0.15);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .card-img {
      width: 100%;
      height: 145px;
      background: #F0F2F0;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 36px;
    }

    .view-btn {
      width: 100%;
      background-color: var(--sage-green);
      border: none;
      padding: 10px 0;
      border-radius: 14px;
      color: #FFFFFF;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.3px;
      transition: background-color 0.3s ease;
    }

    .view-btn:hover {
      background-color: var(--sage-dark);
    }

    /* Footer Social Links (At the bottom) */
    .footer-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
      padding-top: 25px;
      border-top: 1px solid rgba(138, 154, 134, 0.2);
    }

    .footer-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .footer-social-links {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .footer-social-links a {
      color: var(--text-main);
      background: var(--card-bg);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(216, 167, 177, 0.3);
      transition: all 0.3s ease;
    }

    .footer-social-links a:hover {
      transform: translateY(-3px);
      background-color: var(--dusty-rose);
      color: #FFFFFF;
      border-color: var(--dusty-rose);
    }

    .copyright {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

    <!-- Bottom Footer Section (Social Links) -->
    <div class="footer-section">

        <a href="https://youtube.com" target="_blank" title="YouTube">

        <!-- Email Link -->
        <a href="mailto:lostinframess01@gmail.com" title="Email">

      <div class="copyright">© Lostinframess. All Rights Reserved.</div>
    </div>

  </div>

</body>
</html>
