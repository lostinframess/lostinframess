<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lostinframess</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --cream-bg: #F4EEE0;
            --card-bg: #FFFDF9;
            --text-dark: #1A1A1A;
            --text-muted: #666666;
            --btn-blue: #0088cc;
            --btn-black: #111111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            padding: 40px 15px 50px 15px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tagline */
        .top-tagline {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 24px;
            text-transform: uppercase;
            text-align: center;
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .profile-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .profile-ring span {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .username {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
        }

        .verified-icon {
            color: #111;
            font-size: 16px;
        }

        /* Telegram Button */
        .telegram-btn {
            background-color: var(--btn-blue);
            color: white;
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.2);
            margin-bottom: 25px;
        }

        /* Category Card */
        .category-card {
            background: var(--card-bg);
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 20px;
            width: 100%;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .arrow-btn {
            width: 36px;
            height: 36px;
            background: #EBE5D8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Section Titles */
        .section-title {
            width: 100%;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dark);
            margin-bottom: 15px;
            text-align: left;
        }

        /* Products Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .product-img {
            width: 100%;
            height: 130px;
            background: #EAE6DF;
            border-radius: 14px;
            margin-bottom: 12px;
            object-fit: cover;
        }

        .product-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
            min-height: 34px;
            display: flex;
            align-items: center;
        }

        .buy-btn {
            background: var(--btn-black);
            color: white;
            text-decoration: none;
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Divider & Socials */
        hr {
            width: 100%;
            border: none;
            border-top: 1px solid rgba(0,0,0,0.1);
            margin: 20px 0 30px 0;
        }

        .connect-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        footer {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="top-tagline">EVERY FRAME TELLS A STORY</div>

    <div class="profile-header">
        <div class="profile-ring">
            <span>LF</span>
        </div>
        <div class="username">
            LOSTINFRAMESS <i class="fa-solid fa-circle-check verified-icon"></i>
        </div>
        <a href="https://t.me/" class="telegram-btn" target="_blank">
            <i class="fa-paper-plane fa-telegram"></i> Join Telegram Channel
        </a>
    </div>

    <a href="#" class="category-card">
        <span>Movies</span>
        <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
    </a>

    <div class="section-title">MY FINDINGS</div>
    <div class="grid">
        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="Monitor" class="product-img">
            <div class="product-title">200Hz Gaming Monitor</div>
            <a href="#" class="buy-btn">View Product</a>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="Screenbar Light" class="product-img">
            <div class="product-title">Screenbar Monitor Light</div>
            <a href="#" class="buy-btn">View Product</a>
        </div>
    </div>

    <div class="section-title">AUDIO GEAR</div>
    <div class="grid">
        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="IEM Earphones" class="product-img">
            <div class="product-title">Aesthetic IEM Earphones</div>
            <a href="#" class="buy-btn">View Product</a>
        </div>
    </div>

    <hr>

    <div class="connect-title">CONNECT WITH ME</div>
    <div class="social-icons">
        <a href="https://www.instagram.com/lostinframess___/" class="social-icon" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://youtube.com/@lostinframess" class="social-icon" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        <a href="mailto:contact@lostinframess.com" class="social-icon"><i class="fa-regular fa-envelope"></i></a>
    </div>

    <footer>© Lostinframess. All Rights Reserved.</footer>

</div>

</body>
</html>
